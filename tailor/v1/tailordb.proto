message UpdateTailorDBReplicationRequest {
  // The replication is validated after the update is applied, but the request
  // must still name a valid target.
  option (buf.validate.message).cel = {
    id: "update_tailordb_replication.target"
    message: "replication.name is required and must be a valid name"
    expression: "has(this.replication) && this.replication.name.matches('^[a-z0-9][a-z0-9-]{0,61}[a-z0-9]$')"
  };

  string workspace_id = 1 [(buf.validate.field).string.uuid = true];
  // Validated after the masked fields are applied to the stored replication,
  // so a partial update need not carry every required field.
  TailorDBReplication replication = 2 [(buf.validate.field).ignore = IGNORE_ALWAYS];

  google.protobuf.FieldMask update_mask = 100 [
    (fieldmask.v1.masks) = "enabled",
    (fieldmask.v1.masks) = "source.types",
    (fieldmask.v1.masks) = "destination",
    (fieldmask.v1.masks) = "table_prefix"
  ];
}
message UpdateTailorDBReplicationResponse {
  TailorDBReplication replication = 1;
}

message DeleteTailorDBReplicationRequest {
  string workspace_id = 1 [(buf.validate.field).string.uuid = true];
  string name = 2 [(buf.validate.field).string.pattern = "^[a-z0-9][a-z0-9-]{0,61}[a-z0-9]$"];
}
message DeleteTailorDBReplicationResponse {}

