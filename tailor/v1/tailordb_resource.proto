syntax = "proto3";

package tailor.v1;

import "buf/validate/validate.proto";
import "google/api/field_behavior.proto";
import "google/protobuf/duration.proto";
import "google/protobuf/struct.proto";
import "google/protobuf/timestamp.proto";
import "tailor/v1/resource.proto";

message TailorDBService {
  Namespace namespace = 1;
  string default_timezone = 2;
}

message TailorDBType {
  string name = 1 [(buf.validate.field).string.pattern = "^[A-Z][a-zA-Z0-9]{0,62}$"];
  TypeConfig schema = 2;

  message TypeConfig {
    option (buf.validate.message).cel = {
      id: "type_hook_exclusivity"
      message: "type_hook and field-level hooks cannot be defined at the same time"
      expression: "!has(this.type_hook) || (this.fields.all(k, !has(this.fields[k].hooks)) && this.fields.all(k, this.fields[k].fields.all(nk, !has(this.fields[k].fields[nk].hooks))))"
    };
    option (buf.validate.message).cel = {
      id: "type_validate_exclusivity"
      message: "type_validate and field-level validate cannot be defined at the same time"
      expression: "!has(this.type_validate) || (this.fields.all(k, size(this.fields[k].validate) == 0) && this.fields.all(k, this.fields[k].fields.all(nk, size(this.fields[k].fields[nk].validate) == 0)))"
    };

    map<string, FieldConfig> fields = 1;
    string description = 2;
    TypeSetting settings = 3;
    TypePermission type_permission = 4;
    bool extends = 5;
    repeated Directive directives = 6;
    map<string, Index> indexes = 7;
    optional RecordPermission record_permission = 8;
    map<string, RelationshipConfig> relationships = 9;
    Permission permission = 10;
    map<string, FileConfig> files = 11;
    optional TypeHook type_hook = 12;
    optional TypeValidate type_validate = 13;
  }

  message TypeSetting {
    reserved 1;
    bool aggregation = 2;
    bool bulk_upsert = 3;
    optional int64 default_query_limit_size = 4;
    optional int64 max_bulk_upsert_size = 5;
    optional string plural_form = 6 [(buf.validate.field).string.pattern = "^$|^[a-z][a-zA-Z0-9]{0,62}$"];
    bool publish_record_events = 7;
    bool draft = 8;
    DisableGqlOperations disable_gql_operations = 9;
  }

  message DisableGqlOperations {
    bool create = 1;
    bool update = 2;
    bool delete = 3;
    bool read = 4;
  }

  message Directive {
    string name = 1;
    repeated DirectiveArg args = 2;
  }

  message DirectiveArg {
    string name = 1;
    string value = 2;
  }

  message Index {
    repeated string field_names = 1;
    bool unique = 2;
  }

  message FieldConfig {
    string type = 1;
    reserved 2;
    string description = 3;
    optional string source_id = 4;
    bool required = 5;
    bool array = 6;
    repeated ValidateConfig validate = 7;
    map<string, FieldConfig> fields = 8;
    bool index = 9;
    bool unique = 10;
    bool foreign_key = 11;
    optional string foreign_key_type = 12;
    optional string foreign_key_field = 13;
    optional FieldHook hooks = 14;
    repeated Value allowed_values = 15;
    bool vector = 16;
    Serial serial = 17;
    optional int32 scale = 18 [(buf.validate.field).int32 = {
      gte: 0
      lte: 12
    }];
    bool optional_on_create = 19;
  }

  message RelationshipConfig {
    string ref_type = 1;
    string ref_field = 2;
    string src_field = 3;
    bool array = 4;
    string description = 5;
  }

  message FileConfig {
    string description = 1;
  }

  message Value {
    string value = 1 [
      (buf.validate.field).string.pattern = "^[a-zA-Z][a-zA-Z0-9_]{0,62}$",
      (buf.validate.field).string.not_in = "true",
      (buf.validate.field).string.not_in = "false",
      (buf.validate.field).string.not_in = "null"
    ];
    string description = 2;
  }

  message FieldHook {
    optional string create_expr = 1;
    optional string update_expr = 2;
    Script create = 3;
    Script update = 4;
  }

  message TypeHook {
    Script create = 1;
    Script update = 2;
  }

  message TypeValidate {
    Script create = 1;
    Script update = 2;
  }

  message Serial {
    int64 start = 1 [(buf.validate.field).int64.gt = 0];
    optional int64 max_value = 2 [(buf.validate.field).int64.gt = 0];
    optional string format = 3 [(buf.validate.field).string = {
      pattern: "^(?:(?:%%|[^%])*)%(?:[0-9]+)?[doxX](?:(?:%%|[^%])*)$"
      max_len: 32
    }];
    bool gapless = 4;
  }

  message ValidateConfig {
    string expr = 1;
    PermitAction action = 2 [(buf.validate.field).enum = {
      defined_only: true
      not_in: [0]
    }];
    optional string error_message = 3;
    Script script = 4;
  }

  message TypePermission {
    repeated PermissionItem create = 1;
    repeated PermissionItem read = 2;
    repeated PermissionItem update = 3;
    repeated PermissionItem delete = 4;
    repeated PermissionItem admin = 5;
  }

  message RecordPermission {
    repeated PermissionItem read = 1;
    repeated PermissionItem update = 2;
    repeated PermissionItem delete = 3;
  }

  message PermissionItem {
    PermitAction permit = 1 [(buf.validate.field).enum = {
      defined_only: true
      not_in: [0]
    }];
    string id = 2;
    repeated string ids = 3;
  }

  enum PermitAction {
    PERMIT_ACTION_UNSPECIFIED = 0;
    PERMIT_ACTION_ALLOW = 1;
    PERMIT_ACTION_SKIP = 2 [deprecated = true];
    PERMIT_ACTION_DENY = 3;
  }

  message Permission {
    repeated Policy create = 1;
    repeated Policy read = 2;
    repeated Policy update = 3;
    repeated Policy delete = 4;

    message Policy {
      repeated Condition conditions = 1;
      Permit permit = 2 [(buf.validate.field).enum = {
        defined_only: true
        not_in: [0]
      }];
      optional string description = 3;
    }

    message Condition {
      Operand left = 1 [(buf.validate.field).required = true];
      Operator operator = 2 [(buf.validate.field).enum = {
        defined_only: true
        not_in: [0]
      }];
      Operand right = 3 [(buf.validate.field).required = true];
    }

    message Operand {
      oneof kind {
        option (buf.validate.oneof).required = true;
        string user_field = 1 [(buf.validate.field).string.min_len = 1];
        string record_field = 2 [(buf.validate.field).string.min_len = 1];
        string old_record_field = 3 [(buf.validate.field).string.min_len = 1];
        string new_record_field = 4 [(buf.validate.field).string.min_len = 1];
        google.protobuf.Value value = 5;
      }
    }

    enum Operator {
      OPERATOR_UNSPECIFIED = 0;
      OPERATOR_EQ = 1;
      OPERATOR_NE = 2;
      OPERATOR_IN = 3;
      OPERATOR_NIN = 4;
      OPERATOR_HAS_ANY = 5;
      OPERATOR_NHAS_ANY = 6;
    }

    enum Permit {
      PERMIT_UNSPECIFIED = 0;
      PERMIT_ALLOW = 1;
      PERMIT_DENY = 2;
    }
  }
}

message TailorDBGQLPermission {
  string id = 1 [(google.api.field_behavior) = OUTPUT_ONLY];
  repeated Policy policies = 2;

  message Policy {
    repeated Condition conditions = 1;
    repeated Action actions = 2 [(buf.validate.field).repeated = {
      min_items: 1
      items: {
        enum: {
          defined_only: true
          not_in: [0]
        }
      }
    }];
    Permit permit = 3 [(buf.validate.field).enum = {
      defined_only: true
      not_in: [0]
    }];
    optional string description = 4;
  }

  message Condition {
    Operand left = 1 [(buf.validate.field).required = true];
    Operator operator = 2 [(buf.validate.field).enum = {
      defined_only: true
      not_in: [0]
    }];
    Operand right = 3 [(buf.validate.field).required = true];
  }

  message Operand {
    oneof kind {
      option (buf.validate.oneof).required = true;
      string user_field = 1 [(buf.validate.field).string.min_len = 1];
      google.protobuf.Value value = 5;
    }
  }

  enum Operator {
    OPERATOR_UNSPECIFIED = 0;
    OPERATOR_EQ = 1;
    OPERATOR_NE = 2;
    OPERATOR_IN = 3;
    OPERATOR_NIN = 4;
    OPERATOR_HAS_ANY = 5;
    OPERATOR_NHAS_ANY = 6;
  }

  enum Action {
    ACTION_UNSPECIFIED = 0;
    ACTION_ALL = 1;
    ACTION_CREATE = 2;
    ACTION_READ = 3;
    ACTION_UPDATE = 4;
    ACTION_DELETE = 5;
    ACTION_AGGREGATE = 6;
    ACTION_BULK_UPSERT = 7;
  }

  enum Permit {
    PERMIT_UNSPECIFIED = 0;
    PERMIT_ALLOW = 1;
    PERMIT_DENY = 2;
  }
}

// TailorDBReplicationDestination is an external data warehouse that
// TailorDBReplications write into. Creating the first destination in a
// workspace issues the workspace's replication service account, which the
// customer grants access to the destination.
message TailorDBReplicationDestination {
  string name = 1 [(buf.validate.field).string.pattern = "^[a-z0-9][a-z0-9-]{0,61}[a-z0-9]$"];

  oneof kind {
    option (buf.validate.oneof).required = true;

    BigQuery bigquery = 2;
  }

  Status status = 10 [(google.api.field_behavior) = OUTPUT_ONLY];

  // BigQuery is a customer-owned BigQuery dataset.
  message BigQuery {
    // Google Cloud project ID hosting the dataset. Immutable.
    string project = 1 [(buf.validate.field).string.pattern = "^[a-z][a-z0-9-]{4,28}[a-z0-9]$"];
    // BigQuery dataset ID within the project. Immutable.
    string dataset = 2 [(buf.validate.field).string = {
      pattern: "^[a-zA-Z0-9_]+$"
      max_len: 1024
    }];
    // Service account to grant `roles/bigquery.dataEditor` on the dataset and
    // `roles/bigquery.jobUser` on the project. Every destination in the
    // workspace shares it.
    string service_account_email = 3 [(google.api.field_behavior) = OUTPUT_ONLY];
  }

  message Status {
    State state = 1;
    // Why the destination is in its state, e.g. which grant is missing.
    string message = 2;
    google.protobuf.Timestamp last_verified_at = 3;
  }

  enum State {
    STATE_UNSPECIFIED = 0;
    // The grant to the service account has not been verified yet.
    STATE_PENDING_PERMISSION = 1;
    // The grant has been verified.
    STATE_ACTIVE = 2;
    // The grant worked before but the last check was denied, e.g. it was revoked.
    STATE_PERMISSION_ERROR = 3;
  }
}

// TailorDBReplication replicates types of a TailorDB namespace into a
// TailorDBReplicationDestination.
message TailorDBReplication {
  string name = 1 [(buf.validate.field).string.pattern = "^[a-z0-9][a-z0-9-]{0,61}[a-z0-9]$"];
  Source source = 2 [(buf.validate.field).required = true];
  // Name of the TailorDBReplicationDestination to write into.
  string destination = 3 [(buf.validate.field).string.pattern = "^[a-z0-9][a-z0-9-]{0,61}[a-z0-9]$"];
  // Prefix prepended to each destination table name.
  optional string table_prefix = 4 [(buf.validate.field).string.pattern = "^[a-zA-Z_][a-zA-Z0-9_]{0,63}$"];
  bool enabled = 5;

  message Source {
    // TailorDB namespace to read from. Immutable.
    string namespace = 1 [(buf.validate.field).string.pattern = "^[a-z0-9][a-z0-9-]{1,61}[a-z0-9]$"];
    repeated SourceType types = 2 [
      (buf.validate.field).repeated.max_items = 1000,
      (buf.validate.field).cel = {
        id: "replication.source.types.unique"
        message: "each type may appear only once"
        expression: "this.map(t, t.name).unique()"
      }
    ];
  }

  message SourceType {
    string name = 1 [(buf.validate.field).string.pattern = "^[A-Z][a-zA-Z0-9]{0,62}$"];

    oneof fields {
      // Every field but these (e.g. PII). Fields added later are replicated.
      FieldList exclude_fields = 2;
      // Only these fields. Fields added later are not replicated.
      FieldList include_fields = 3;
    }
  }

  message FieldList {
    repeated string names = 1 [(buf.validate.field).repeated = {
      min_items: 1
      max_items: 1000
      unique: true
      items: {
        string: {pattern: "^[a-z][0-9a-zA-Z]{0,62}$"}
      }
    }];
  }
}

// TailorDBReplicationTableStatus is the live state of one replicated type.
message TailorDBReplicationTableStatus {
  string type = 1;
  // Destination table name, table_prefix included.
  string table = 2;
  State state = 3;
  google.protobuf.Timestamp backfill_completed_at = 4;
  google.protobuf.Duration lag = 5;
  // Last error, when state is ERROR.
  string message = 6;

  enum State {
    STATE_UNSPECIFIED = 0;
    // Waiting for a backfill of the table.
    STATE_PENDING = 1;
    STATE_BACKFILLING = 2;
    STATE_STREAMING = 3;
    STATE_ERROR = 4;
  }
}
